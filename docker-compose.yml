services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: findam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: findam
      POSTGRES_PASSWORD: findam
      POSTGRES_DB: findam
    ports:
      - "5432:5432"
    volumes:
      - findam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findam -d findam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  findam_postgres_data:
