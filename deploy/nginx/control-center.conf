# Control Centre frontend and server-side product connector.
# Enable only after control.grastadomhan.com resolves to this VPS.
server {
    listen 80;
    server_name control.grastadomhan.com;
    root /var/www/findam/apps/control-center-web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { try_files $uri $uri/ /index.html; }
}
