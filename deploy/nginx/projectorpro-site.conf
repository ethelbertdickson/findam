# Public Projector Pro site and authenticated user portal.
server {
    listen 80;
    server_name projectorpro.grastadomhan.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name projectorpro.grastadomhan.com;

    root /var/www/findam/apps/projectorpro-site;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/projectorpro.grastadomhan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projectorpro.grastadomhan.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Public download statistics remain on the legacy Findam API for now.
    location = /api/v1/projectorpro/downloads/stats {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Account, auth, top-up, and usage requests use the dedicated API.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
