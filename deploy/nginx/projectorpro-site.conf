# Standalone ProjectorPro product page on its dedicated domain.
server {
    listen 80;
    server_name projectorpro.grastadomhan.com;

    root /var/www/findam/apps/projectorpro-site;
    index index.html;

    # Keep the public stats request same-origin with the product page.
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
