# Serve the existing Findam website on its dedicated domain.
# The legacy root domain remains configured independently during migration.
server {
    listen 80;
    server_name findam.grastadomhan.com;

    root /var/www/findam/apps/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
