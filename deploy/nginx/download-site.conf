# Public download host. Add download.grastadomhan.com A record before enabling TLS.
server {
    listen 80;
    server_name download.grastadomhan.com;

    location = /projectorpro/latest {
        proxy_pass http://127.0.0.1:3000/api/v1/projectorpro/downloads/latest;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
