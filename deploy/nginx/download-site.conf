# Public download host. Add download.grastadomhan.com A record before enabling TLS.
server {
    listen 80;
    server_name download.grastadomhan.com;

    location = /projectorpro/windows {
        proxy_pass http://127.0.0.1:3000/api/v1/projectorpro/downloads/windows;
        include /etc/nginx/snippets/findam-download-proxy.conf;
    }
    location = /projectorpro/linux {
        proxy_pass http://127.0.0.1:3000/api/v1/projectorpro/downloads/linux;
        include /etc/nginx/snippets/findam-download-proxy.conf;
    }
    location = /projectorpro/macos {
        proxy_pass http://127.0.0.1:3000/api/v1/projectorpro/downloads/macos;
        include /etc/nginx/snippets/findam-download-proxy.conf;
    }

    location = /projectorpro/latest {
        return 404;
    }
    location / { return 404; }
}
