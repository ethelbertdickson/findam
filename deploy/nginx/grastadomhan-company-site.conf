# Initial HTTP virtual host for the Grasta Domhan company homepage.
# Certbot can add HTTPS after DNS points at this server.
server {
    listen 80;
    server_name grastadomhan.com;

    root /var/www/findam/apps/company-site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
